; Calage in Docker. Uploads go in chunks anyway; these limits only matter without JavaScript.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 200
memory_limit = 256M
max_execution_time = 120
expose_php = Off
; Errors go to the container logs (docker compose logs).
log_errors = On
error_log = /dev/stderr

# Calage with Docker Compose: docker compose up -d, then open http://localhost:8080
services:
  calage:
    build: .
    image: calage:latest
    restart: unless-stopped
    ports:
      - "${CALAGE_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # The data/ and i/ folders of this checkout, as on shared hosting (ignored by git).
      - ./data:/var/www/html/data # config.php, database, temporary files
      - ./i:/var/www/html/i       # hosted images: never delete them
